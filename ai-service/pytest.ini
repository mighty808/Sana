[pytest]
# `testpaths` keeps a bare `pytest` from walking venv/ and chroma_db/, which
# would otherwise cost seconds and can pick up third-party test files.
testpaths = tests

# The suite imports the service the same way the app does — `from rag.pipeline
# import ...`, `from main import app` — so the ai-service directory itself has
# to be importable. Setting it here means the tests run with a plain `pytest`
# from this directory, with no PYTHONPATH juggling and no src-layout package.
pythonpath = .

# Show the reason for every non-passing outcome (skips included) rather than a
# bare character, so a skipped test can't quietly look like a passing one.
addopts = -ra

# LangChain's similarity_search_with_relevance_scores warns whenever a score
# falls outside 0-1, and prints the full text of every document it retrieved
# with it. For this embedding model and collection, negative scores are normal
# and expected — rag/pipeline.py's MIN_RELEVANCE_SCORE comment documents the
# observed range, and out-of-knowledge-base queries scoring below zero is
# precisely the signal the refusal test relies on. Left unfiltered it buries
# tests/test_retrieval.py's actual output under thousands of lines of medical
# prose, so a real failure becomes unreadable.
filterwarnings =
    ignore:Relevance scores must be between:UserWarning
