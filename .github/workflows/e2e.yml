name: E2E

# The repo's first CI. Runs the Playwright suite against an ephemeral,
# in-memory MongoDB (server/src/test/e2eServer.ts) — it never touches the real
# Atlas database, and needs no secrets for the same reason.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The Python service, in its own job rather than a step in `e2e` below.
  # Nothing here depends on Node, MongoDB or a browser, so running it in
  # parallel means a broken pipeline is reported in about a minute instead of
  # waiting out the full browser suite. A failure in either job fails the run.
  ai-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # tests/test_retrieval.py and tests/test_knowledge_base.py load the real
      # all-MiniLM-L6-v2 model. Without this cache every run re-downloads
      # ~80MB from Hugging Face, which is both slow and a third-party outage
      # away from failing a build for reasons that have nothing to do with the
      # commit. Keyed on the model name so a change of embedding model misses
      # the cache and fetches the new one, as it should.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      # No GROQ_API_KEY is set, and that is deliberate: the whole suite is
      # designed to run without one. The LLM is faked in every test except
      # tests/test_retrieval.py, which measures retrieval only and never calls
      # a model. Generation quality is reviewed locally with `python -m
      # rag.eval`, which does need a key — keeping it out of CI means no
      # secret to leak, no API spend per push, and no LLM non-determinism
      # deciding whether a build passes.
      - name: Run tests
        working-directory: ai-service
        run: python -m pytest -q

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # Chromium only. The edge/mobile/visual projects are opt-in locally and
      # would each add minutes here for little extra signal on every push.
      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      # Type safety for both halves. The backend Jest suite is a separate
      # concern from this workflow's e2e focus, but the type check is cheap
      # and catches a broken refactor before the slow browser run starts.
      #
      # These are two steps with their own working-directory rather than one
      # step using `npm --prefix`. `--prefix` only changes where npm resolves
      # the *package*; the process cwd stays put, so `-p tsconfig.app.json`
      # resolved against the repo root and tsc exited 1 with
      # "The specified path does not exist".
      - name: Type-check client
        working-directory: client
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Type-check server
        working-directory: server
        run: npm run test:types

      - name: Run backend tests
        working-directory: server
        run: npm test

      - name: Run Playwright e2e
        working-directory: client
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
